# Deploys the cron job on wasmCloud v2 (runtime operator >= 2.5.2).
#
#   kubectl apply -f deploy/deployment.yaml
#
# See https://wasmcloud.com/docs/quickstart/deploy-a-webassembly-workload/
#
# There is no Kubernetes Service here: the job serves no traffic, it only
# runs on a schedule.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: cron-job
spec:
  # One replica, on purpose. Every replica runs its own copy of the schedule,
  # so two replicas run the job twice per tick. Scaling this up needs the job
  # itself to be safe to run concurrently, or a lock it takes first.
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      # `service`, not `components`. The host calls `wasi:cli/run` on a
      # workload's service, once, when the workload starts; a component
      # listed under `components` is only ever invoked by incoming calls, so
      # its run export would never be called.
      service:
        image: ghcr.io/[your-org]/cron-job:0.1.0
        localResources:
          environment:
            config:
              # Five fields for minute granularity; an optional leading
              # seconds field and descriptors such as @hourly or @every 90s
              # are accepted too. Evaluated in UTC.
              CRON_SCHEDULE: "*/5 * * * *"
      hostInterfaces:
        # main.go logs through wasilog, which imports wasi:logging. A real
        # host binds only what the manifest names, so leaving this out fails
        # the workload with "a matching implementation was not found in the
        # linker". `wash dev` derives it from the imports, so it only shows
        # up on deploy.
        - namespace: wasi
          package: logging
          interfaces:
            - logging
